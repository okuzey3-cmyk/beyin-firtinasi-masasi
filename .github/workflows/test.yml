name: Baglanti Testi
on: workflow_dispatch
permissions:
  contents: read
  models: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: GitHub Models testi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -i https://models.github.ai/inference/chat/completions \
            -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" \
            -d '{"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"merhaba de"}]}' | head -c 1500
          echo; echo ---- python ----
          python3 -c "
          import urllib.request,os,json
          r=urllib.request.Request('https://models.github.ai/inference/chat/completions',data=json.dumps({'model':'openai/gpt-4.1-mini','messages':[{'role':'user','content':'merhaba de'}]}).encode(),method='POST')
          r.add_header('Authorization','Bearer '+os.environ['GITHUB_TOKEN']); r.add_header('Content-Type','application/json')
          print(urllib.request.urlopen(r).read()[:400])
          r.add_header('User-Agent','beyin-firtinasi-masasi')
          print(urllib.request.urlopen(r).read()[:400])
          "
