name: Sabah Toplantısı

on:
  schedule:
    # GitHub zamanlayıcısı bazen gecikiyor ya da atlıyor; bu yüzden sabah birkaç kez deniyor.
    # O günün toplantısı zaten yapıldıysa sonraki denemeler hiçbir şey yapmadan çıkar.
    - cron: "7 4 * * *"    # 07:07
    - cron: "37 4 * * *"   # 07:37
    - cron: "17 5 * * *"   # 08:17
    - cron: "47 6 * * *"   # 09:47
    - cron: "27 9 * * *"   # 12:27
  workflow_dispatch:       # Elle de başlatılabilir
    inputs:
      soru:
        description: "Masaya sormak istediğin soru (boş bırakırsan günün iş fikri tartışılır)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: masa
  cancel-in-progress: false

jobs:
  toplanti:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bugün toplantı yapıldı mı?
        id: kontrol
        run: |
          BUGUN=$(TZ=Europe/Istanbul date +%Y-%m-%d)
          echo "bugun=$BUGUN" >> $GITHUB_OUTPUT
          if [ -f "data/$BUGUN.json" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Bugünün toplantısı zaten yapılmış, atlanıyor."
            echo "atla=1" >> $GITHUB_OUTPUT
          fi

      - name: Masa toplanıyor
        id: masa
        if: steps.kontrol.outputs.atla != '1'
        env:
          SORU: ${{ github.event.inputs.soru }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python masa.py

      - name: Sonucu kaydet
        if: steps.kontrol.outputs.atla != '1'
        run: |
          git config user.name "Beyin Fırtınası Masası"
          git config user.email "masa@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Masa toplantısı: ${{ steps.masa.outputs.kayit }}"
          git push

      - name: Telefona bildirim gönder
        if: steps.kontrol.outputs.atla != '1'
        env:
          KAYIT: ${{ steps.masa.outputs.kayit }}
        run: |
          python3 - <<'PY' || true
          import json, os, urllib.request
          kid = os.environ['KAYIT']
          d = json.load(open(f"data/{kid}.json")); k = d["karar"]
          soru = d.get("tur") == "soru"
          mesaj = {
              "topic": "beyin-masasi-70025e1c",
              "title": ("Masanın cevabı hazır: " if soru else "Günün fikri: ") + k.get("baslik", ""),
              "message": f"{k.get('tek_cumle','')}\n\nGerçeklik: {k.get('gerceklik_puani','?')}/10 · {k.get('karar','')}",
              "tags": ["bulb"],
              "click": "https://okuzey3-cmyk.github.io/beyin-firtinasi-masasi/#" + kid,
          }
          req = urllib.request.Request("https://ntfy.sh", data=json.dumps(mesaj).encode(),
                                       headers={"Content-Type": "application/json"})
          print(urllib.request.urlopen(req, timeout=20).status)
          PY
