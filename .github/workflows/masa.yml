name: Sabah Toplantısı

on:
  schedule:
    - cron: "7 4 * * *"   # Her gün 07:07 (Türkiye saati)
  workflow_dispatch:       # Elle de başlatılabilir

permissions:
  contents: write
  models: read

concurrency:
  group: masa
  cancel-in-progress: false

jobs:
  toplanti:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Masa toplanıyor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python masa.py

      - name: Sonucu kaydet
        run: |
          git config user.name "Beyin Fırtınası Masası"
          git config user.email "masa@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Sabah toplantısı: $(date -u +%Y-%m-%d)"
          git push
